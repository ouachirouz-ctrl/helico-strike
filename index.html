<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hélico Strike</title>
<!-- ADSENSE : remplace ca-pub-XXXXXXXXXXXXXXXX par ton ID éditeur -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#1c2214;color:#f3ead2;font-family:'Arial Black',Impact,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative;display:flex;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:360/600;touch-action:none;background:#6b7a3a}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(28,34,20,.82);text-align:center;padding:24px}
#ov h1{font-size:2.4rem;line-height:1;color:#f2a72e}
#ov p{font-family:Arial,sans-serif;font-size:1rem;max-width:280px;line-height:1.4}
button{font:inherit;font-size:1.2rem;background:#f2a72e;color:#1c2214;border:0;padding:14px 36px;border-radius:6px;cursor:pointer}
button:focus-visible{outline:3px solid #f3ead2;outline-offset:3px}
#ad{height:60px;display:flex;justify-content:center;align-items:center;background:#11160c;padding-bottom:env(safe-area-inset-bottom,0)}
#ad ins{display:inline-block;width:320px;height:50px;background:#232b18}
</style>
</head>
<body>
<div id="stage">
  <canvas id="g" width="360" height="600"></canvas>
  <div id="ov">
    <h1 id="ovT">Hélico Strike</h1>
    <p id="ovS">Glisse le doigt pour piloter. Le tir est automatique. Détruis drones, chars et gunships.</p>
    <button id="btn">Jouer</button>
  </div>
</div>
<div id="ad">
  <ins class="adsbygoogle" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="0000000000"></ins>
</div>
<script>
try{(adsbygoogle=window.adsbygoogle||[]).push({})}catch(e){}

const c=document.getElementById('g'),x=c.getContext('2d'),W=360,H=600;
const ov=document.getElementById('ov'),ovT=document.getElementById('ovT'),ovS=document.getElementById('ovS'),btn=document.getElementById('btn');
let S='menu',score=0,best=0,lives=3,t=0,sp=0,gy=0,P,B=[],E=[],EB=[],FX=[],tx=180,ty=500,keys={},last=0;
try{best=+localStorage.getItem('hs')||0}catch(e){}
const rr=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

const patches=Array.from({length:14},(_,i)=>({x:rr(0,300),y:i*50,w:rr(50,140),h:rr(30,70),c:['#7d8a45','#5e6c31','#8f8d52','#c2ad78'][i%4]}));

function start(){score=0;lives=3;t=0;sp=0;P={x:180,y:500,inv:0,cd:0};B=[];E=[];EB=[];FX=[];tx=180;ty=500;S='play';ov.style.display='none'}
function over(){S='over';best=Math.max(best,score);try{localStorage.setItem('hs',best)}catch(e){}
  ovT.textContent='Mission terminée';ovS.textContent='Score : '+score+'  ·  Record : '+best;btn.textContent='Rejouer';ov.style.display='flex'}
btn.onclick=start;

function ptr(e){const r=c.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W;ty=(e.clientY-r.top)/r.height*H-70}
c.addEventListener('pointerdown',ptr);c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')ptr(e)});
addEventListener('keydown',e=>{keys[e.key]=1;if(S!=='play'&&(e.key==='Enter'||e.key===' '))start()});
addEventListener('keyup',e=>keys[e.key]=0);

function boom(px,py,r){FX.push({x:px,y:py,l:.4,m:.4,r})}

function update(dt){
  t+=dt;gy=(gy+60*dt)%700;
  if(keys.ArrowLeft||keys.a||keys.q)tx=P.x-80;
  if(keys.ArrowRight||keys.d)tx=P.x+80;
  if(keys.ArrowUp||keys.w||keys.z)ty=P.y-80;
  if(keys.ArrowDown||keys.s)ty=P.y+80;
  tx=Math.max(20,Math.min(W-20,tx));ty=Math.max(60,Math.min(H-40,ty));
  P.x+=(tx-P.x)*Math.min(1,dt*12);P.y+=(ty-P.y)*Math.min(1,dt*12);
  P.inv=Math.max(0,P.inv-dt);
  P.cd-=dt;if(P.cd<=0){P.cd=.17;B.push({x:P.x-9,y:P.y-14},{x:P.x+9,y:P.y-14})}
  B.forEach(b=>b.y-=540*dt);B=B.filter(b=>b.y>-10);
  sp-=dt;
  if(sp<=0){sp=Math.max(.35,1.1-t*.01);const r=Math.random();
    const k=r<.55?'d':(r<.9||t<25)?'t':'h';
    const px=rr(30,330);E.push({k,x:px,x0:px,y:-30,hp:k=='d'?1:k=='t'?3:8,cd:rr(.6,1.6),ph:rr(0,6)})}
  E.forEach(e=>{
    if(e.k=='d'){e.y+=110*dt;e.x=e.x0+Math.sin(t*3+e.ph)*40}
    else{e.y+=(e.k=='t'?60:45)*dt;e.cd-=dt;
      if(e.cd<=0&&e.y>0&&e.y<H-120){e.cd=e.k=='t'?1.8:1.3;
        const a=Math.atan2(P.y-e.y,P.x-e.x);
        (e.k=='t'?[0]:[-.3,0,.3]).forEach(o=>EB.push({x:e.x,y:e.y,vx:Math.cos(a+o)*150,vy:Math.sin(a+o)*150}))}}
  });
  E=E.filter(e=>e.y<H+40);
  EB.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});EB=EB.filter(b=>b.x>-10&&b.x<W+10&&b.y>-10&&b.y<H+10);
  B.forEach(b=>E.forEach(e=>{if(!b.d&&Math.hypot(b.x-e.x,b.y-e.y)<(e.k=='h'?24:16)){b.d=1;e.hp--;
    if(e.hp<=0){score+=e.k=='d'?10:e.k=='t'?30:80;boom(e.x,e.y,e.k=='h'?38:24)}}}));
  B=B.filter(b=>!b.d);E=E.filter(e=>e.hp>0);
  if(P.inv<=0){
    const hit=E.some(e=>dist(e,P)<24)||EB.some(b=>dist(b,P)<12);
    if(hit){lives--;P.inv=1.6;EB=[];boom(P.x,P.y,30);if(lives<=0)over()}
  }
  FX.forEach(f=>f.l-=dt);FX=FX.filter(f=>f.l>0);
}

function heli(px,py,col,s){
  x.save();x.translate(px,py);x.scale(s,s);
  x.fillStyle=col;x.beginPath();x.ellipse(0,0,9,16,0,0,7);x.fill();
  x.fillRect(-2,10,4,20);x.fillRect(-7,26,14,3);
  x.fillStyle='#9fd3e6';x.beginPath();x.ellipse(0,-6,5,7,0,0,7);x.fill();
  x.strokeStyle='rgba(243,234,210,.75)';x.lineWidth=3;x.rotate(t*30);
  x.beginPath();x.moveTo(-26,0);x.lineTo(26,0);x.moveTo(0,-26);x.lineTo(0,26);x.stroke();
  x.restore()}

function draw(){
  x.fillStyle='#6b7a3a';x.fillRect(0,0,W,H);
  patches.forEach(p=>{x.fillStyle=p.c;x.fillRect(p.x,((p.y+gy)%700)-70,p.w,p.h)});
  x.fillStyle='#4a7c8c';x.fillRect(250,0,26,H);
  x.fillStyle='rgba(0,0,0,.18)';x.fillRect(250,0,3,H);
  E.forEach(e=>{
    if(e.k=='d'){x.fillStyle='#2b2f24';x.beginPath();x.moveTo(e.x,e.y-12);x.lineTo(e.x+12,e.y);x.lineTo(e.x,e.y+12);x.lineTo(e.x-12,e.y);x.fill();
      x.fillStyle='#d9503a';x.beginPath();x.arc(e.x,e.y,3.5,0,7);x.fill()}
    else if(e.k=='t'){x.fillStyle='#3a3f2a';x.fillRect(e.x-13,e.y-16,26,32);x.fillStyle='#262a1b';x.fillRect(e.x-17,e.y-16,5,32);x.fillRect(e.x+12,e.y-16,5,32);
      const a=Math.atan2(P.y-e.y,P.x-e.x);x.save();x.translate(e.x,e.y);x.rotate(a);x.fillStyle='#b8402f';x.fillRect(-6,-6,12,12);x.fillRect(0,-2,20,4);x.restore()}
    else heli(e.x,e.y,'#7a2a22',1.3)});
  x.fillStyle='#f2a72e';B.forEach(b=>x.fillRect(b.x-1.5,b.y-7,3,12));
  x.fillStyle='#ff6a4d';EB.forEach(b=>{x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()});
  if(P&&(P.inv<=0||Math.floor(t*14)%2))heli(P.x,P.y,'#e8e0c4',1);
  FX.forEach(f=>{const k=1-f.l/f.m;x.fillStyle=`rgba(242,167,46,${1-k})`;x.beginPath();x.arc(f.x,f.y,f.r*k+4,0,7);x.fill();
    x.fillStyle=`rgba(255,240,200,${1-k})`;x.beginPath();x.arc(f.x,f.y,f.r*k*.5,0,7);x.fill()});
  x.fillStyle='rgba(28,34,20,.7)';x.fillRect(0,0,W,34);
  x.fillStyle='#f3ead2';x.font='bold 18px Arial Black,Impact,sans-serif';x.textAlign='left';x.fillText(score,12,24);
  x.textAlign='right';x.fillStyle='#f2a72e';x.fillText('♥'.repeat(Math.max(0,lives)),W-12,24);
}

function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(S==='play')update(dt);
  draw();requestAnimationFrame(loop)}
P={x:180,y:500,inv:0,cd:0};
requestAnimationFrame(loop);
</script>
</body>
  </html>
